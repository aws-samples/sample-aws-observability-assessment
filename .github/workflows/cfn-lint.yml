name: CloudFormation Lint

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed CloudFormation inputs
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            1-observability-assessment-role.yaml
            2-observability-assessment-codebuild.yaml
            .github/workflows/cfn-lint.yml

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Linting CloudFormation templates..."
          cfn-lint 1-observability-assessment-role.yaml
          cfn-lint 2-observability-assessment-codebuild.yaml

      - name: Skip message
        if: steps.changed-files.outputs.any_changed == 'false'
        run: echo "No CloudFormation template or lint workflow changed - skipping CloudFormation linting"
